services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # One-off runner for scripts (probe, seed, ingestion, etc.) with full
  # devDependencies and source mounted live. Not started by `up`.
  #   docker compose run --rm tools npx tsx scripts/probe-datagoth.ts
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    profiles:
      - tools
    depends_on:
      - mongo
    entrypoint: []
    command: ["sleep", "infinity"]

volumes:
  mongo-data:
