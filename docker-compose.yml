services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    # Vertex AI service-account key. Put the JSON at backend/secrets/gcp-key.json
    # and set GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-key.json in
    # backend/.env (a container path, not a Windows one). The `tools` service
    # already sees it through its ./backend:/app mount.
    volumes:
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (rs.status().ok !== 1) quit(1); } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Bound to loopback only: this MongoDB has no authentication, so it must not
    # be reachable from other machines on the network (threat T26).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # One-off runner for scripts (seed, ingestion, etc.)
  #   docker compose run --rm tools npx tsx scripts/seed.ts
  tools:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    profiles:
      - tools
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: []
    command: ["sleep", "infinity"]

volumes:
  mongo-data:
