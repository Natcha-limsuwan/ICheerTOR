name: Security

# SAST + dependency scanning (grading item 14; threat T27).
# Results appear under the repository's Security → Code scanning tab.

on:
  push:
    branches: [main, develop, "security/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # weekly, catches newly published advisories
  workflow_dispatch:

# Least privilege for every job unless a job asks for more.
permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate production dependency SBOM from lockfile
        run: npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx --sbom-type=application > sbom.cyclonedx.json
        working-directory: ${{ matrix.app }}
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: ${{ matrix.app }}/sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan (public packs + project rules)
        run: >
          semgrep scan --metrics=off
          --config p/owasp-top-ten --config p/nodejs --config p/typescript
          --config p/react --config p/jwt --config p/secrets
          --config security/semgrep/icheertor-rules.yml
          --exclude node_modules --exclude .next --exclude backend/eval
          --sarif --output semgrep.sarif
          --error
          backend/src frontend/app frontend/components frontend/lib
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Attack the API (in-memory MongoDB)
        run: npm run test:security
        working-directory: backend

  dependencies:
    name: npm audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.app }}
