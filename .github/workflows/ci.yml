name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Type Check Backend
        run: |
          npm ci
          npx tsc --noEmit
        working-directory: backend
      - name: Type Check Frontend
        run: |
          npm ci
          npx tsc --noEmit
        working-directory: frontend

  test:
    name: Unit and Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Run Tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: docs/testing/evidence/

  integration:
    name: Integration and Local Load Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27019:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Run Integration and Load Tests
        run: node scripts/testing/run.mjs --integration --load
        env:
          TEST_EXTERNAL_MONGO: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-load-results
          path: docs/testing/evidence/

  e2e:
    name: Browser End-to-End Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27019:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install Dependencies and Browsers
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          TEST_EXTERNAL_MONGO: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: docs/testing/evidence/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build Backend
        run: |
          npm ci
          npm run build
        working-directory: backend
      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
